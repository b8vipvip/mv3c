# mv3c application settings and chat2api credentials live in MongoDB.
# The only non-database secrets are generated automatically in mv3c-data on first boot.
name: mv3c

services:
  mv3c:
    build:
      context: .
      dockerfile: Dockerfile
    image: mv3c:local
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/mv3c/entrypoint.sh"]
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/mv3c
      SEARCH: "false"
      # One mv3c app replica, no Redis-backed shared generation store.
      # Required for schedule routes; without it they permanently return 503.
      SCHEDULES_SINGLE_PROCESS: "true"
      LOG_TO_FILE: "false" # Replace upstream long-lived 20MB/error logs with bounded mv3c log
    ports:
      - "127.0.0.1:${MV3C_PORT:-3080}:3080"
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mv3c-images:/app/client/public/images
      - mv3c-uploads:/app/uploads
      - mv3c-logs:/app/api/logs
      - mv3c-data:/app/data
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s

  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    command: mongod --noauth
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "5"
    volumes:
      - mv3c-mongodb:/data/db
    # MongoDB is intentionally private to the Compose network.

volumes:
  mv3c-mongodb:
  mv3c-images:
  mv3c-uploads:
  mv3c-logs:
  mv3c-data:
