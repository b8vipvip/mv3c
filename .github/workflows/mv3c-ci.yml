name: mv3c validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run mv3c regression tests
        run: python3 -m unittest discover -s mv3c/tests -v
      - name: Validate encrypted settings, bootstrap and MCP tool protocol
        run: |
          node --test mv3c/tests/settings.test.cjs
          node --test mv3c/tests/toolBridge.test.cjs
          node --test mv3c/tests/pluginCatalog.test.cjs
      - name: Audit Simplified Chinese core chat translations
        run: node --test mv3c/tests/i18n_coverage.test.cjs
      - name: Validate host-side update agent and installer
        run: |
          python3 -m unittest discover -s mv3c/updater/tests -p 'test_*.py' -v
          python3 -m py_compile mv3c/updater/agent.py
          bash -n mv3c/updater/install.sh
          bash -n mv3c/updater/bootstrap-prebuilt.sh
          python3 -m py_compile mv3c/updater/prebuilt.py
          node --check mv3c/updater/bridge.cjs
      - name: Validate env-free Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.mv3c.yml config --quiet
          python3 - <<'PY'
          import json, subprocess
          for compose in ('docker-compose.yml', 'docker-compose.mv3c.yml'):
              output = subprocess.check_output(
                  ['docker', 'compose', '-f', compose, 'config', '--format', 'json'],
                  text=True,
              )
              env = json.loads(output)['services']['mv3c']['environment']
              assert env.get('SCHEDULES_SINGLE_PROCESS') == 'true', compose
          print('Single-process scheduler assertion present in production and CI compose')
          PY
      - name: Verify imported source branding
        run: |
          if [ -f client/index.html ]; then
            python3 mv3c/apply_branding.py --check
          else
            echo "Source import pending; bootstrap workflow will add it."
          fi
