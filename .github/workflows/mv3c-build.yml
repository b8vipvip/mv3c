name: mv3c source Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mv3c-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smart-plan:
    runs-on: ubuntu-latest
    outputs:
      image_required: ${{ steps.plan.outputs.image_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether an attested release image is required
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          FORCE_IMAGE: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          required=true
          if [[ "$FORCE_IMAGE" != "true" && -f .github/gptauto/smart_update.py ]]; then
            target="$(git rev-parse HEAD)"
            base="$BASE_SHA"
            if [[ ! "$base" =~ ^[a-f0-9]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
              base="$(git rev-parse HEAD^)"
            fi
            if python3 .github/gptauto/smart_update.py --repo mv3c --worktree . \
                --from-sha "$base" --target-sha "$target" > /tmp/smart-plan.json; then
              mode="$(python3 -c 'import json; print(json.load(open("/tmp/smart-plan.json"))["mode"])')"
              [[ "$mode" != "checks-only" && "$mode" != "no-op" ]] || required=false
            fi
          fi
          echo "image_required=$required" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: smart-plan
    if: needs.smart-plan.outputs.image_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build mv3c from modified source
        run: |
          started="$(date +%s)"
          docker build --progress=plain \
            --build-arg NODE_MAX_OLD_SPACE_SIZE=4096 \
            --build-arg NPM_CI_TIMEOUT_SECONDS=1800 \
            --build-arg BUILD_COMMIT=${{ github.sha }} \
            --build-arg BUILD_BRANCH=${{ github.ref_name }} \
            --build-arg BUILD_VERSION=unreleased \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t mv3c:ci .
          echo "MV3C_CI_BUILD_SECONDS=$(($(date +%s) - started))" >> "$GITHUB_ENV"
      - name: Measure build-stage and final-runtime image sizes
        timeout-minutes: 5
        run: |
          # The full dependency-install/build layers belong to the builder,
          # not the production runtime. BuildKit reuses its completed cache.
          docker build --progress=plain --target build \
            --build-arg NODE_MAX_OLD_SPACE_SIZE=4096 \
            --build-arg NPM_CI_TIMEOUT_SECONDS=1800 \
            -t mv3c:builder-ci .
          builder_bytes=$(docker image inspect --format '{{.Size}}' mv3c:builder-ci)
          runtime_bytes=$(docker image inspect --format '{{.Size}}' mv3c:ci)
          echo "MV3C builder size: $builder_bytes bytes"
          echo "MV3C runtime size: $runtime_bytes bytes"
          echo "MV3C final image reduction: $((builder_bytes - runtime_bytes)) bytes"
          echo "### Docker image size audit" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build stage | Bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build workspace | $builder_bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production runtime | $runtime_bytes |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$runtime_bytes" -ge "$builder_bytes" ]; then
            echo "ERROR: production image is not smaller than build workspace"
            exit 1
          fi
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^mv3c:'
      - name: Audit production filesystem footprint
        run: |
          # Do not clean anything here. Preserve measurements for future
          # workspace-scoped slimming without guessing what runtime requires.
          docker run --rm --entrypoint sh mv3c:ci -c '
            set -eu
            test -f /app/api/server/index.js
            test -f /app/mv3c/entrypoint.sh
            test -d /app/client/dist
            test -d /app/node_modules
            for path in /app/node_modules /app/api /app/client /app/packages /app/mv3c; do
              du -sh "$path"
            done
          '
          docker history --human --no-trunc mv3c:ci | head -n 25
      - name: Benchmark optional Actions image transfer (not a deploy artifact)
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          started="$(date +%s)"
          archive="$RUNNER_TEMP/mv3c-ci-benchmark.tar.gz"
          docker save mv3c:ci | gzip -1 > "$archive"
          packed_bytes="$(stat -c %s "$archive")"
          export MV3C_COMPRESSED_BYTES="$packed_bytes"
          export MV3C_PACK_SECONDS="$(($(date +%s) - started))"
          python3 - <<'PY'
          import os
          size = int(os.environ["MV3C_COMPRESSED_BYTES"])
          secs = int(os.environ["MV3C_PACK_SECONDS"])
          compiled = int(os.environ["MV3C_CI_BUILD_SECONDS"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              print("### MV3C: source-build vs optional image transfer", file=out)
              print(f"CI source Docker build: {compiled}s; gzip packaging: {secs}s", file=out)
              print(f"Compressed CI candidate: {size/1024**2:.1f} MiB", file=out)
              print("| Effective download | Transfer only | CI build + package + transfer |", file=out)
              print("| --- | ---: | ---: |", file=out)
              for mbps in (5, 20, 50, 100):
                  transport = size * 8 / (mbps * 10**6)
                  print(f"| {mbps} Mbps | {transport:.0f}s | {compiled+secs+transport:.0f}s |", file=out)
              print("Excludes image import, registry/API latency, CI queue and SHA/version attestation. "
                    "The CI tag is unreleased and MUST NOT be deployed; "
                    "production remains local-SHA-build plus verified rollback.", file=out)
          PY
          rm -f "$archive"
      - name: Start env-free mv3c and verify public startup
        timeout-minutes: 10
        run: |
          docker tag mv3c:ci mv3c:local
          docker compose -f docker-compose.mv3c.yml up -d --no-build
          ready=0
          for i in $(seq 1 80); do
            if curl --silent --fail http://127.0.0.1:3080/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" != 1 ]; then
            echo "mv3c did not become ready"
            exit 1
          fi
          curl --silent --fail http://127.0.0.1:3080/api/config > /tmp/mv3c-startup.json
          curl --silent --fail http://127.0.0.1:3080/api/config/version > /tmp/mv3c-version.json
          node -e "const x=require('/tmp/mv3c-version.json');if(x.sha!==process.env.GITHUB_SHA||x.version!=='unreleased')process.exit(1);console.log('Runtime revision attestation OK')"
          node -e "const x=require('/tmp/mv3c-startup.json'); if(x.appTitle!=='mv3c'||x.registrationEnabled!==true) process.exit(1); console.log('env-free startup and first-user registration are ready')"
      - name: Exercise first admin login and persisted provider configuration
        timeout-minutes: 3
        run: |
          curl --silent --show-error --fail -X POST \
            -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Admin","email":"smoke@example.test","password":"SmokePassword123!","confirm_password":"SmokePassword123!"}' \
            http://127.0.0.1:3080/api/auth/register > /tmp/mv3c-register.json
          curl --silent --show-error --fail -X POST \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:3080' \
            -d '{"email":"smoke@example.test","password":"SmokePassword123!"}' \
            http://127.0.0.1:3080/api/auth/login > /tmp/mv3c-login.json
          token=$(node -e "const x=require('/tmp/mv3c-login.json');if(!x.token)process.exit(1);process.stdout.write(x.token)")
          curl --silent --show-error --fail -X PUT \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"site":{"title":"mv3c CI","registrationEnabled":false},"chat2api":{"enabled":true,"baseURL":"https://example.com/v1","apiKey":"sk-ci-test","fetchModels":false,"models":["gpt-6-sol"]}}' \
            http://127.0.0.1:3080/api/admin/mv3c > /tmp/mv3c-save.json
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:3080/api/admin/mv3c > /tmp/mv3c-settings.json
          curl --silent --show-error --fail \
            http://127.0.0.1:3080/api/config > /tmp/mv3c-config-after.json
          node -e "
            const fs=require('fs');
            const saved=JSON.parse(fs.readFileSync('/tmp/mv3c-settings.json'));
            const config=JSON.parse(fs.readFileSync('/tmp/mv3c-config-after.json'));
            if(!saved.chat2api.apiKeyConfigured || saved.chat2api.baseURL!=='https://example.com/v1')process.exit(1);
            if(JSON.stringify(saved).includes('sk-ci-test'))process.exit(1);
            if(config.appTitle!=='mv3c CI' || config.registrationEnabled!==false)process.exit(1);
            console.log('Admin API, encrypted provider config and live site changes OK');
          "
      - name: Verify read-only public health and admin authorization acceptance
        timeout-minutes: 2
        run: |
          python3 mv3c/updater/host_acceptance.py \
            --expected-version unreleased --expected-sha "$GITHUB_SHA"
      - name: Validate updater inside the live Docker stack
        timeout-minutes: 3
        run: |
          docker compose exec -T mv3c node -e 'const assert=require("node:assert/strict"); assert.equal(process.env.UV_DEFAULT_INDEX, "https://pypi.org/simple"); assert.equal(process.env.PIP_INDEX_URL, "https://pypi.org/simple"); console.log("Python/MCP runtime index environment OK")'
          docker compose exec -T mv3c node --test /app/mv3c/updater/tests/test_updater.cjs
          docker compose exec -T mv3c node --test /app/mv3c/updater/tests/test_runtime_logs.cjs
          docker compose exec -T mv3c node /app/mv3c/updater/tests/integration.cjs
          docker compose exec -T mv3c node /app/mv3c/updater/bridge.cjs state > /tmp/mv3c-updater-state.json
          node -e "const x=require('/tmp/mv3c-updater-state.json');if(!x.config||x.config.channel!=='release')process.exit(1);console.log('Updater database bridge ready')"
      # CI validates the commit. Production hosts independently pull the same
      # SHA and build with persistent Docker layer and BuildKit npm caches.
      - name: Check immutable image revision
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' mv3c:ci)" = "${GITHUB_SHA}"
      - name: Dump runtime logs on failure
        if: failure()
        run: docker compose -f docker-compose.mv3c.yml logs --tail=250
