name: mv3c GHCR historical compressed-layer verification

on:
  workflow_dispatch:
    inputs:
      older_version:
        description: Previously attested official image Release
        required: true
        default: v0.1.37
        type: string
      newer_version:
        description: Later attested official image Release
        required: true
        default: v0.1.38
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: mv3c-ghcr-historical-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      OLDER: ${{ inputs.older_version }}
      NEWER: ${{ inputs.newer_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable image proofs and download exact archives
        id: images
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OLDER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$NEWER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$OLDER" != "$NEWER"
          git fetch origin "refs/tags/$OLDER:refs/tags/$OLDER" "refs/tags/$NEWER:refs/tags/$NEWER" \
            "refs/tags/mv3c-image/$OLDER:refs/tags/mv3c-image/$OLDER" \
            "refs/tags/mv3c-image/$NEWER:refs/tags/mv3c-image/$NEWER"
          mkdir -p "$RUNNER_TEMP/mv3c-images"
          for version in "$OLDER" "$NEWER"; do
            release_sha="$(git rev-parse "refs/tags/$version^{commit}")"
            proof_sha="$(git rev-parse "refs/tags/mv3c-image/$version^{commit}")"
            test "$release_sha" = "$proof_sha"
            proof="$(git for-each-ref --format='%(contents)' "refs/tags/mv3c-image/$version")"
            expected_sha="$(printf '%s\n' "$proof" | sed -n 's/^archive_sha256=//p')"
            expected_size="$(printf '%s\n' "$proof" | sed -n 's/^archive_size=//p')"
            test "$(printf '%s\n' "$proof" | sed -n 's/^sha=//p')" = "$release_sha"
            test "$(printf '%s\n' "$proof" | sed -n 's/^release=//p')" = "$version"
            [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]]
            [[ "$expected_size" =~ ^[0-9]+$ ]]
            name="mv3c-$version-$release_sha.tar.gz"
            gh release download "$version" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/mv3c-images"
            path="$RUNNER_TEMP/mv3c-images/$name"
            test "$(stat -c %s "$path")" = "$expected_size"
            echo "$expected_sha  $path" | sha256sum --check --status
            docker load -i "$path"
            docker image inspect "mv3c:sha-$release_sha" > "$RUNNER_TEMP/inspect.json"
            RELEASE_SHA="$release_sha" RELEASE_VERSION="$version" python3 - <<'PY'
          import json,os
          image=json.load(open(os.environ['RUNNER_TEMP']+'/inspect.json'))[0]
          assert image['Config']['Labels']['org.opencontainers.image.revision']==os.environ['RELEASE_SHA']
          assert image['Config']['Labels']['org.opencontainers.image.version']==os.environ['RELEASE_VERSION']
          PY
            if [[ "$version" == "$OLDER" ]]; then
              echo "older_sha=$release_sha" >> "$GITHUB_OUTPUT"
            else
              echo "newer_sha=$release_sha" >> "$GITHUB_OUTPUT"
            fi
            rm -f "$path"
          done
      - name: Push immutable SHA tags to GHCR (no production deployment)
        env:
          OLDER_SHA: ${{ steps.images.outputs.older_sha }}
          NEWER_SHA: ${{ steps.images.outputs.newer_sha }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for sha in "$OLDER_SHA" "$NEWER_SHA"; do
            ref="$image:sha-$sha"
            docker tag "mv3c:sha-$sha" "$ref"
            docker push "$ref"
          done
      - name: Compare real compressed OCI blob digests and sizes
        env:
          OLDER_SHA: ${{ steps.images.outputs.older_sha }}
          NEWER_SHA: ${{ steps.images.outputs.newer_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 mv3c/updater/oci_blob_audit.py \
            --previous "$image:sha-$OLDER_SHA" \
            --current "$image:sha-$NEWER_SHA" \
            | tee "$RUNNER_TEMP/ghcr-compressed-layer-audit.json"
          python3 - "$RUNNER_TEMP/ghcr-compressed-layer-audit.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          if not result['previous_available']:
              raise SystemExit('Previous GHCR manifest missing; comparison not proven')
          if result['compressed_reusable_bytes'] is None:
              raise SystemExit('Compressed reuse bytes unavailable')
          print('GHCR compressed layer comparison completed')
          PY
