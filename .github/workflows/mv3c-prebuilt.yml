name: mv3c verified prebuilt image delivery

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact previously published official version (vX.Y.Z)
        required: true
        type: string

concurrency:
  # Serialize all official Release archives so no published proof points to
  # an asset concurrently being replaced by a second publisher.
  group: mv3c-prebuilt-delivery
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve verified Release SHA and both successful CI runs
        id: version
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$VERSION" --json isDraft,isPrerelease,tagName > /tmp/mv3c-release.json
          python3 - <<'PY'
          import json, os
          info=json.load(open("/tmp/mv3c-release.json",encoding="utf-8"))
          if (info.get("isDraft") is not False
                  or info.get("isPrerelease") is not False
                  or info.get("tagName") != os.environ["VERSION"]):
              raise SystemExit("Requested tag is not an exact published official Release")
          print("Exact official GitHub Release verified")
          PY
          git fetch --no-tags origin \
            "refs/tags/$VERSION:refs/mv3c-release/tags/$VERSION" \
            "refs/tags/mv3c-verified/$VERSION:refs/mv3c-release/proofs/$VERSION" \
            "refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "refs/mv3c-release/tags/$VERSION^{commit}")"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          # Do not overwrite a previously attested good incoming archive on rerun.
          if git ls-remote --tags origin "refs/tags/mv3c-image/$VERSION" | grep -q .; then
            echo "::error::This official Release already has a published image proof"
            exit 1
          fi
          export RELEASE_SHA="$sha"
          python3 - <<'PY'
          import os,pathlib
          from mv3c.updater.agent import verify_release_proof
          import subprocess
          def git(repo,*args):
              return subprocess.check_output(["git",*args],cwd=repo,text=True).strip()
          verify_release_proof(pathlib.Path.cwd(),os.environ["VERSION"],os.environ["RELEASE_SHA"])
          print("Both official CI results and Git published Release proof passed")
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout precisely attested source
        run: |
          git checkout --detach "${{ steps.version.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.version.outputs.sha }}"
      # The default original docker build remains an independent fallback.
      # The dependency snapshot experiment is opt-in, isolated to the GitHub
      # Actions runner and never changes the production daemon or updater.
      - name: Set up Buildx for persistent production dependency cache
        if: vars.MV3C_ENABLE_PROD_DEPS_CACHE == 'enabled'
        uses: docker/setup-buildx-action@v4
      - name: Materialize source-invariant production dependencies
        if: vars.MV3C_ENABLE_PROD_DEPS_CACHE == 'enabled'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod-deps
          load: true
          push: false
          tags: mv3c:prod-deps-ci-cache
          cache-from: type=gha,scope=mv3c-prod-deps
          # Only cache this dependency-only stage; do NOT export the multi-GB
          # development/build tree, source artifacts, or runtime credentials.
          cache-to: type=gha,scope=mv3c-prod-deps,mode=min,ignore-error=true,timeout=15m
          build-args: |
            NODE_MAX_OLD_SPACE_SIZE=4096
            NPM_CI_TIMEOUT_SECONDS=1800
      - name: Capture version-bound build timestamp
        if: vars.MV3C_ENABLE_PROD_DEPS_CACHE == 'enabled'
        id: build_timestamp
        run: echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build version-bound runtime with persistent production dependency cache
        if: vars.MV3C_ENABLE_PROD_DEPS_CACHE == 'enabled'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: mv3c:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=mv3c-prod-deps
          build-args: |
            NODE_MAX_OLD_SPACE_SIZE=4096
            NPM_CI_TIMEOUT_SECONDS=1800
            BUILD_COMMIT=${{ steps.version.outputs.sha }}
            BUILD_BRANCH=main
            BUILD_VERSION=${{ inputs.version }}
            BUILD_DATE=${{ steps.build_timestamp.outputs.utc }}
      - name: Build version-bound runtime in Actions
        if: vars.MV3C_ENABLE_PROD_DEPS_CACHE != 'enabled'
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          docker build --progress=plain \
            --build-arg NODE_MAX_OLD_SPACE_SIZE=4096 \
            --build-arg NPM_CI_TIMEOUT_SECONDS=1800 \
            --build-arg BUILD_COMMIT="$RELEASE_SHA" \
            --build-arg BUILD_BRANCH=main \
            --build-arg BUILD_VERSION="$VERSION" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "mv3c:sha-$RELEASE_SHA" .
      - name: Smoke-test exact versioned image before Release asset upload
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          docker image tag "mv3c:sha-$RELEASE_SHA" mv3c:local
          # Actions runners start with no Mongo image; prefetch ONLY the CI
          # test dependency before enforcing --pull never on the smoke stack.
          # This pull happens on GitHub Actions, NEVER on the production host.
          docker pull mongo:8.0.20
          docker compose -f docker-compose.mv3c.yml up -d --no-build --pull never
          healthy=0
          for attempt in $(seq 1 80); do
            if curl --silent --fail http://127.0.0.1:3080/readyz >/dev/null; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [ "$healthy" != 1 ]; then
            docker compose -f docker-compose.mv3c.yml logs --tail=150
            exit 1
          fi
          curl --silent --fail http://127.0.0.1:3080/api/config/version > /tmp/release-version.json
          node -e 'const v=require("/tmp/release-version.json"); if(v.sha!==process.env.RELEASE_SHA||v.version!==process.env.VERSION) process.exit(1); console.log("Official Release runtime attestation PASSED")'
          docker compose -f docker-compose.mv3c.yml down
      - name: Verify OCI revision/version/source and package official image
        id: package
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          docker image inspect "mv3c:sha-$RELEASE_SHA" > "$RUNNER_TEMP/image.json"
          python3 - <<'PY'
          import json,os,re
          img=json.load(open(os.environ["RUNNER_TEMP"]+"/image.json"))[0]
          sha=os.environ["RELEASE_SHA"]
          version=os.environ["VERSION"]
          labels=img["Config"]["Labels"]
          env=img["Config"]["Env"]
          assert labels["org.opencontainers.image.revision"]==sha
          assert labels["org.opencontainers.image.version"]==version
          assert labels["org.opencontainers.image.source"]=="https://github.com/b8vipvip/mv3c"
          assert "BUILD_COMMIT="+sha in env
          assert "MV3C_VERSION="+version in env
          assert re.fullmatch(r"sha256:[0-9a-f]{64}",img["Id"])
          assert img["RootFS"]["Layers"] and img["Size"]>0
          print("Official OCI identity verified:",img["Id"])
          PY
          name="mv3c-$VERSION-$RELEASE_SHA.tar.gz"
          docker save "mv3c:sha-$RELEASE_SHA" | gzip -1 > "$RUNNER_TEMP/$name"
          archive_sha="$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)"
          archive_size="$(stat -c %s "$RUNNER_TEMP/$name")"
          image_id="$(docker image inspect --format '{{.Id}}' "mv3c:sha-$RELEASE_SHA")"
          image_size="$(docker image inspect --format '{{.Size}}' "mv3c:sha-$RELEASE_SHA")"
          test "$archive_size" -gt 0
          # GitHub Release assets allow at most 2 GiB per file.
          test "$archive_size" -lt 2147483648
          {
            echo "name=$name"
            echo "archive_sha=$archive_sha"
            echo "archive_size=$archive_size"
            echo "image_id=$image_id"
            echo "image_size=$image_size"
          } >> "$GITHUB_OUTPUT"
      - name: Measure OCI layer-reuse potential without overstating savings
        id: layers
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: python3 mv3c/updater/layer_audit.py
      - name: Publish official archive to GitHub Release assets
        env:
          IMAGE_NAME: ${{ steps.package.outputs.name }}
          ARCHIVE_SIZE: ${{ steps.package.outputs.archive_size }}
        run: |
          set -euo pipefail
          # Public Release assets are downloaded by the host over HTTPS.
          # This avoids the observed ~17 KiB/s inbound SCP bottleneck.
          # Neither this workflow nor GitHub can access the host Docker socket.
          test -f "$RUNNER_TEMP/$IMAGE_NAME"
          test "$(stat -c %s "$RUNNER_TEMP/$IMAGE_NAME")" = "${{ steps.package.outputs.archive_size }}"
          gh release upload "$VERSION" "$RUNNER_TEMP/$IMAGE_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Require an exact uploaded name and byte size before publishing
          # the trusted Git proof. The host still checks SHA-256 independently.
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets > "$RUNNER_TEMP/assets.json"
          python3 - <<'PY'
          import json,os
          data=json.load(open(os.environ["RUNNER_TEMP"]+"/assets.json"))
          name=os.environ["IMAGE_NAME"]
          expected=int(os.environ["ARCHIVE_SIZE"])
          matching=[a for a in data["assets"] if a["name"] == name]
          if len(matching)!=1 or matching[0]["size"]!=expected:
              raise SystemExit("Uploaded GitHub Release asset name/size mismatch")
          print("Release asset uploaded and size verified:",name,expected)
          PY
      - name: Optionally publish OCI image to GHCR (reusable Docker layers)
        id: registry
        if: vars.MV3C_ENABLE_OCI_REGISTRY == 'enabled'
        # GHCR is optional: a private package or outage must not invalidate
        # the full attested Release archive.
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref="$image:sha-$RELEASE_SHA"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "mv3c:sha-$RELEASE_SHA" "$ref"
          docker push "$ref"
          docker image inspect --format '{{json .RepoDigests}}' "$ref" > "$RUNNER_TEMP/mv3c-repodigests.json"
          export OCI_REPO="$image"
          python3 - <<'PY'
          import json, os, re
          refs = json.load(open(os.environ["RUNNER_TEMP"] + "/mv3c-repodigests.json"))
          name = os.environ["OCI_REPO"] + "@"
          digests = [ref.removeprefix(name) for ref in refs if ref.startswith(name)]
          if len(digests) != 1 or not re.fullmatch(r"sha256:[a-f0-9]{64}", digests[0]):
              raise SystemExit("Registry did not return exactly one SHA256 manifest digest")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("digest=" + digests[0], file=out)
          print("OCI manifest was published:", digests[0][:24])
          PY
      - name: Record protected archive/image proof AFTER asset publication
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          ARCHIVE_SHA: ${{ steps.package.outputs.archive_sha }}
          ARCHIVE_SIZE: ${{ steps.package.outputs.archive_size }}
          IMAGE_ID: ${{ steps.package.outputs.image_id }}
          IMAGE_SIZE: ${{ steps.package.outputs.image_size }}
          REGISTRY_DIGEST: ${{ steps.registry.outcome == 'success' && steps.registry.outputs.digest || '' }}
          ROOTFS_DIFF_IDS: ${{ steps.layers.outputs.rootfs_diff_ids }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          proof="mv3c-image/$VERSION"
          if git ls-remote --tags origin "refs/tags/$proof" | grep -q .; then
            echo "::error::Prebuilt proof already exists: $proof"
            exit 1
          fi
          # Registry digest (when available) joins the SAME immutable Git proof.
          message="MV3C_PREBUILT_IMAGE_V1
          release=$VERSION
          sha=$RELEASE_SHA
          archive_sha256=$ARCHIVE_SHA
          archive_size=$ARCHIVE_SIZE
          image_id=$IMAGE_ID
          image_size=$IMAGE_SIZE
          build_run_id=$GITHUB_RUN_ID
          rootfs_diff_ids=$ROOTFS_DIFF_IDS"
          if [[ -n "$REGISTRY_DIGEST" ]]; then
            message="$message
          registry=ghcr.io/${GITHUB_REPOSITORY,,}
          registry_digest=$REGISTRY_DIGEST"
          fi
          git tag -a "$proof" "$RELEASE_SHA" -m "$message"
          git push origin "refs/tags/$proof"
          {
            echo "### Verified image delivered for $VERSION"
            echo "Commit: $RELEASE_SHA"
            echo "OCI image ID: $IMAGE_ID"
            echo "Archive SHA256: $ARCHIVE_SHA"
            echo "Proof tag: $proof"
          } >> "$GITHUB_STEP_SUMMARY"
